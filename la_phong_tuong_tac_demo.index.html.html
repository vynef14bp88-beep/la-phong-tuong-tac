<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lá Phong Tương Tác</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff4df, #f7d9b5);
  }

  .card {
    width: min(92vw, 600px);
    min-height: 500px;
    padding: 35px 25px;
    border-radius: 28px;
    text-align: center;
    background: rgba(255,255,255,.72);
    box-shadow: 0 18px 50px rgba(80,45,20,.18);
    backdrop-filter: blur(8px);
  }

  h1 {
    margin: 0 0 8px;
    color: #8f321e;
    font-size: clamp(28px, 6vw, 44px);
  }

  p {
    margin: 0 0 25px;
    color: #6d5142;
    font-size: 17px;
  }

  .leaf-wrap {
    height: 270px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }

  .leaf {
    position: relative;
    width: 145px;
    height: 175px;
    transform: rotate(45deg);
    transition: transform .7s cubic-bezier(.2,1.5,.4,1);
    filter: drop-shadow(10px 14px 8px rgba(90,40,10,.2));
  }

  .leaf::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #ffb22e, #e84b24 58%, #a91f20);
    border-radius: 10% 90% 10% 90%;
    clip-path: polygon(50% 0%, 58% 24%, 78% 8%, 70% 34%,
                       100% 27%, 76% 49%, 98% 65%, 68% 61%,
                       82% 94%, 55% 69%, 50% 100%, 43% 69%,
                       17% 94%, 31% 61%, 2% 65%, 24% 49%,
                       0% 27%, 30% 34%, 22% 8%, 42% 24%);
  }

  .leaf::after {
    content: "";
    position: absolute;
    width: 5px;
    height: 190px;
    background: #7c391f;
    left: 50%;
    top: 3px;
    transform: translateX(-50%) rotate(-45deg);
    transform-origin: top;
    border-radius: 10px;
    opacity: .8;
  }

  .leaf-wrap:hover .leaf {
    transform: rotate(45deg) scale(1.08);
  }

  .leaf.active {
    animation: flutter 1.2s ease-in-out;
  }

  @keyframes flutter {
    0% { transform: rotate(45deg) scale(1); }
    25% { transform: rotate(25deg) scale(1.12); }
    50% { transform: rotate(65deg) scale(.92); }
    75% { transform: rotate(32deg) scale(1.08); }
    100% { transform: rotate(45deg) scale(1); }
  }

  #message {
    min-height: 28px;
    font-weight: bold;
    color: #a33a20;
    opacity: 0;
    transform: translateY(8px);
    transition: .35s;
  }

  #message.show {
    opacity: 1;
    transform: translateY(0);
  }

  button {
    border: 0;
    padding: 12px 22px;
    border-radius: 999px;
    background: #a83b20;
    color: white;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(120,45,20,.2);
  }

  button:hover { transform: translateY(-2px); }
</style>
</head>

<body>
  <main class="card">
    <h1>🍁 Lá Phong Tương Tác</h1>
    <p>Hãy nhấn vào chiếc lá để xem hiệu ứng.</p>

    <div class="leaf-wrap" id="leafButton" aria-label="Nhấn vào lá phong">
      <div class="leaf" id="leaf"></div>
    </div>

    <div id="message">✨ Bạn đã tương tác với chiếc lá!</div>
    <br>
    <button id="reset">Thử lại</button>
  </main>

<script>
  const leaf = document.getElementById("leaf");
  const leafButton = document.getElementById("leafButton");
  const message = document.getElementById("message");
  const reset = document.getElementById("reset");

  leafButton.addEventListener("click", () => {
    leaf.classList.remove("active");
    void leaf.offsetWidth;
    leaf.classList.add("active");
    message.classList.add("show");
  });

  reset.addEventListener("click", () => {
    leaf.classList.remove("active");
    message.classList.remove("show");
  });
</script>
</body>
</html>
